/* ---------------- Demo Prediction Engine ---------------- */
/* Clearly-separated mock ML pipeline. Swap this module out for a trained
   XGBoost / Scikit-learn service without touching any UI component. */
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function runAIAnalysis(p){
  const progressGap = p.plannedProgress - p.actualProgress;
  const milestoneRatio = p.totalMilestones ? p.delayedMilestones / p.totalMilestones : 0;
  const resourceGap = p.resourcesPlanned ? (p.resourcesPlanned - p.resourcesUsed)/p.resourcesPlanned : 0;
  const spendRatio = p.plannedCost ? p.currentExpenditure / p.plannedCost : 1;
  const expectedSpendRatio = p.plannedProgress ? p.actualProgress / p.plannedProgress : 1;

  const delayRisk = clamp(
    progressGap*1.9 + milestoneRatio*100*0.55 + p.previousDelays*6 + (100-p.contractorPerformance)*0.25, 0, 100
  );
  const costRisk = clamp(
    clamp((spendRatio - expectedSpendRatio)*180,0,60) + (100-p.contractorPerformance)*0.3 + p.previousDelays*5, 0, 100
  );
  const overallRisk = Math.round(clamp(delayRisk*0.5 + costRisk*0.35 + resourceGap*100*0.15, 0, 100));

  let classification = "LOW";
  if(overallRisk>=76) classification="CRITICAL";
  else if(overallRisk>=51) classification="HIGH";
  else if(overallRisk>=31) classification="MEDIUM";

  const estDelayMonths = +clamp((delayRisk/100)*p.plannedDuration*0.35,0,24).toFixed(1);
  const estCostOverrunCr = +clamp((costRisk/100)*p.plannedCost*0.22,0,p.plannedCost).toFixed(1);

  const factors = [
    {label:"Actual progress behind schedule", value: clamp(progressGap,0,100)},
    {label:"Delayed milestones", value: Math.round(milestoneRatio*100)},
    {label:"Expenditure vs. planned progress", value: Math.round(clamp((spendRatio-expectedSpendRatio)*100,0,100))},
    {label:"Prior delay history", value: clamp(p.previousDelays*18,0,100)},
    {label:"Resource utilization gap", value: Math.round(clamp(resourceGap*100,0,100))},
    {label:"Contractor performance", value: 100-p.contractorPerformance},
  ].sort((a,b)=>b.value-a.value);

  const reasons = [];
  if(progressGap>5) reasons.push(`Actual progress is ${Math.round(progressGap)}% behind the planned schedule.`);
  if(p.delayedMilestones>0) reasons.push(`${p.delayedMilestones} of ${p.totalMilestones} milestones are currently delayed.`);
  if(spendRatio>expectedSpendRatio+0.05) reasons.push("Current expenditure is running ahead of physical progress.");
  if(p.previousDelays>0) reasons.push(`${p.previousDelays} prior delay event${p.previousDelays>1?'s':''} detected on this project.`);
  if(resourceGap>0.1) reasons.push("Resource deployment is below the planned allocation.");
  if(p.contractorPerformance<60) reasons.push("Contractor performance rating is below the acceptable threshold.");
  if(reasons.length===0) reasons.push("No material risk indicators detected — project is tracking to plan.");

  const actions = [];
  if(p.delayedMilestones>0) actions.push("Review delayed milestones with the executing agency.");
  if(spendRatio>expectedSpendRatio) actions.push("Investigate the cause of the cost increase.");
  if(resourceGap>0.1) actions.push("Reallocate manpower and equipment to critical work fronts.");
  if(progressGap>10) actions.push("Update the project schedule and recovery plan.");
  if(overallRisk>=51) actions.push("Assign a responsible nodal officer for immediate intervention.");
  if(actions.length===0) actions.push("Continue routine monitoring — no intervention required.");

  return {delayRisk:Math.round(delayRisk), costRisk:Math.round(costRisk), overallRisk, classification,
          estDelayMonths, estCostOverrunCr, factors, reasons, actions};
}

function Gauge({value,color,label,sub,size=150}){
  const r=(size/2)-14, c=size/2, circ=2*Math.PI*r;
  const pct = clamp(value,0,100)/100;
  return (
    <div className="flex flex-col items-center">
      <svg width={size} height={size}>
        <circle cx={c} cy={c} r={r} stroke="#E7ECF3" strokeWidth="12" fill="none"/>
        <circle cx={c} cy={c} r={r} stroke={color} strokeWidth="12" fill="none"
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
          transform={`rotate(-90 ${c} ${c})`} style={{transition:"stroke-dashoffset .8s ease"}}/>
        <text x={c} y={c-2} textAnchor="middle" fontSize="30" fontWeight="700" fill="var(--text)" fontFamily="IBM Plex Mono">{value}%</text>

      </svg>
      <div className="text-sm font-semibold mt-1" style={{color:"var(--navy)"}}>{label}</div>
    </div>
  );
}

function GroupedBars({data,keys,colors,fmt}){
  const max = Math.max(...data.flatMap(d=>keys.map(k=>d[k])))*1.15;
  return (
    <div className="flex items-end gap-4 h-48 pt-4">
      {data.map((d,i)=>(
        <div key={i} className="flex-1 flex flex-col items-center gap-1">
          <div className="flex items-end gap-1 h-40 w-full justify-center">
            {keys.map((k,ki)=>(

            ))}
          </div>
          <div className="text-[10px] text-slate-500 text-center leading-tight">{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function DonutChart({segments,size=150}){
  const total = segments.reduce((s,x)=>s+x.value,0)||1;
  const r=size/2-14, c=size/2; let acc=0;
  return (
    <div className="flex items-center gap-4">
      <svg width={size} height={size}>
        {segments.map((s,i)=>{
          const frac=s.value/total; const dash=2*Math.PI*r;
          const off = dash*(1-frac); const rot = -90 + acc*360;
          acc += frac;
          return <circle key={i} cx={c} cy={c} r={r} fill="none" stroke={s.color} strokeWidth="20"
            strokeDasharray={dash} strokeDashoffset={off} transform={`rotate(${rot} ${c} ${c})`}/>;
        })}
        <text x={c} y={c+5} textAnchor="middle" fontSize="20" fontWeight="700" fontFamily="IBM Plex Mono">{total}</text>
      </svg>
      <div className="space-y-1.5">
        {segments.map((s,i)=>(
          <div key={i} className="flex items-center gap-2 text-xs">
            <span className="w-2.5 h-2.5 rounded-sm" style={{background:s.color}}/>
            <span className="text-slate-600">{s.label}</span>
            <span className="font-mono font-semibold ml-auto">{s.value}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Sparkline({points,color}){
  const w=280,h=90,max=Math.max(...points),min=Math.min(...points);
  const pts = points.map((p,i)=>{
    const x = (i/(points.length-1))*(w-20)+10;
    const y = h-10-((p-min)/((max-min)||1))*(h-30);
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {points.map((p,i)=>{
        const x=(i/(points.length-1))*(w-20)+10, y=h-10-((p-min)/((max-min)||1))*(h-30);
        return <circle key={i} cx={x} cy={y} r="3" fill={color}/>;
      })}
    </svg>
  );
}

function LoginPage({onLogin}){
  const [remember,setRemember]=useState(true);
  /* view: login | fp-email | fp-code | fp-reset | fp-success */
  const [view,setView]=useState("login");
  const [fpEmail,setFpEmail]=useState("officer.pmo@gov.in");

  const [pw1,setPw1]=useState("");

  const [loginPassword,setLoginPassword]=useState("");

  const [justReset,setJustReset]=useState(false);

  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fpEmail.trim());

  function sendCode(){
    if(!emailValid){ setFpError("Enter a valid email address."); return; }
    setFpError("");
    const code = Math.floor(100000 + Math.random()*900000).toString();
    setGenCode(code);
    setCodeInput("");
    setResendTick(t=>t+1);
    setView("fp-code");
  }

  function verifyCode(){
    if(codeInput.trim().length!==6){ setFpError("Enter the 6-digit code."); return; }
    if(codeInput.trim()!==genCode){ setFpError("Incorrect code. Check the demo code below and try again."); return; }
    setFpError("");
    setPw1(""); setPw2("");
    setView("fp-reset");
  }

  function attemptLogin(){
    if(loginPassword.length===0){ setLoginError("Enter your password."); return; }
    if(loginPassword!==currentPassword){ setLoginError("Incorrect password. If you recently reset it, make sure you're using your new password."); return; }
    setLoginError("");
    onLogin();
  }

  function resetPassword(){
    if(pw1.length<8){ setFpError("Password must be at least 8 characters."); return; }
    if(!/[A-Z]/.test(pw1) || !/[0-9]/.test(pw1)){ setFpError("Include at least one uppercase letter and one number."); return; }
    if(pw1!==pw2){ setFpError("Passwords do not match."); return; }
    setFpError("");
    setCurrentPassword(pw1);
    setJustReset(true);
    setView("fp-success");
  }

  function backToLogin(){
    setView("login"); setFpError(""); setCodeInput(""); setGenCode(""); setPw1(""); setPw2("");
    setLoginPassword(""); setLoginError("");
  }

  const pwScore = (()=>{

    if(/[0-9]/.test(pw1)) s++;

function DashboardPage({projects,goDetails}){
  const withRisk = useMemo(()=>projects.map(p=>({...p, ai: runAIAnalysis(p)})),[projects]);

  withRisk.forEach(p=>counts[p.ai.classification]++);
  const totalBudget = projects.reduce((s,p)=>s+p.plannedCost,0);
  const avgProgress = Math.round(projects.reduce((s,p)=>s+p.actualProgress,0)/projects.length);
  const delayed = projects.filter(p=>p.actualDuration>p.plannedDuration).length;
  const highRisk = withRisk.filter(p=>p.ai.classification==="HIGH"||p.ai.classification==="CRITICAL")

  const byCategory = {};
  projects.forEach(p=>byCategory[p.type]=(byCategory[p.type]||0)+1);

            {label:"Low",value:counts.LOW,color:RISK_COLORS.LOW},

          <div className="flex gap-4 text-[11px] text-slate-500 mt-2">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{background:"#B9CBE8"}}/>Planned</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{background:"var(--accent)"}}/>Actual</span>

      <div className="grid lg:grid-cols-3 gap-4">

const FIELD_DEFS = [
  ["name","Project Name","text","New Infrastructure Project"],
  ["type","Project Type","select",["Highway Construction","Railway Expansion","Water Supply Project","Power Plant","Bridge Construction","Metro Project","Airport Expansion"]],
  ["state","State / Location","text","Karnataka"],
  ["plannedCost","Planned Cost (₹ Cr)","number",250],
  ["currentExpenditure","Current Expenditure (₹ Cr)","number",120],
  ["plannedDuration","Planned Duration (months)","number",24],
  ["actualDuration","Actual Duration (months)","number",22],
  ["plannedProgress","Planned Progress (%)","number",70],
  ["actualProgress","Actual Progress (%)","number",55],
  ["totalMilestones","Total Milestones","number",10],
  ["completedMilestones","Completed Milestones","number",5],
  ["delayedMilestones","Delayed Milestones","number",2],
  ["resourcesPlanned","Resources Planned","number",100],
  ["resourcesUsed","Resources Used","number",82],
  ["previousDelays","Previous Delays","number",1],
  ["contractorPerformance","Contractor Performance (0–100)","number",65],
];

function AddProjectPage({onAnalyze}){
  const [form,setForm]=useState(()=>{
    const f={}; FIELD_DEFS.forEach(([k,,t,d])=>f[k]= t==="select"? d[0] : d); return f;
  });
  const [analyzing,setAnalyzing]=useState(false);
  const set=(k,v)=>setForm({...form,[k]:v});

  const submit=()=>{
    setAnalyzing(true);
    setTimeout(()=>{
      const project = {...form, id:"P-"+Math.floor(1000+Math.random()*9000), location: form.state, status:"In Progress",
        plannedCost:+form.plannedCost, currentExpenditure:+form.currentExpenditure, plannedDuration:+form.plannedDuration,
        actualDuration:+form.actualDuration, plannedProgress:+form.plannedProgress, actualProgress:+form.actualProgress,
        totalMilestones:+form.totalMilestones, completedMilestones:+form.completedMilestones, delayedMilestones:+form.delayedMilestones,
        resourcesPlanned:+form.resourcesPlanned, resourcesUsed:+form.resourcesUsed, previousDelays:+form.previousDelays,
        contractorPerformance:+form.contractorPerformance};
      setAnalyzing(false);
      onAnalyze(project);
    },1200);
  };

  return (
    <div className="p-6 fadein max-w-4xl">
      <div className="card rounded-lg p-6">
        <div className="text-sm font-semibold mb-4" style={{color:"var(--navy)"}}>Register New Project</div>
        <div className="grid md:grid-cols-2 gap-4">
          {FIELD_DEFS.map(([key,label,type,def])=>(
            <div key={key}>
              <label className="text-xs font-medium text-slate-600">{label}</label>
              {type==="select" ? (
                <select value={form[key]} onChange={e=>set(key,e.target.value)} className="w-full mt-1 px-3 py-2 text-sm rounded-md border bg-white" style={{borderColor:"var(--border)"}}>
                  {def.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
              ) : (
                <input type={type} value={form[key]} onChange={e=>set(key,e.target.value)} className="w-full mt-1 px-3 py-2 text-sm rounded-md border" style={{borderColor:"var(--border)"}}/>
              )}
            </div>
          ))}
        </div>
        <button disabled={analyzing} onClick={submit} className="mt-6 w-full py-3 rounded-md text-white text-sm font-bold tracking-wide relative overflow-hidden disabled:opacity-80" style={{background:"var(--navy)"}}>
          {analyzing ? "ANALYZING PROJECT…" : "ANALYZE PROJECT WITH AI"}
          {analyzing && <span className="absolute left-0 top-0 h-full w-1/4 bg-white/20 scan-anim"/>}
        </button>
      </div>
    </div>
  );
}

/* ---------------- AI Risk Analysis + Explainable AI ---------------- */
function AIAnalysisPage({projects,selectedId,setSelectedId}){
  const [running,setRunning]=useState(false);
  const [result,setResult]=useState(null);
  const project = projects.find(p=>p.id===selectedId) || projects[0];

  useEffect(()=>{ if(project) setResult(runAIAnalysis(project)); },[selectedId]);

  const run=()=>{
    setRunning(true); setResult(null);
    setTimeout(()=>{ setResult(runAIAnalysis(project)); setRunning(false); },1100);
  };

  if(!project) return <div className="p-6 text-slate-400 text-sm">No projects available.</div>;

  return (
    <div className="p-6 space-y-5 fadein">
      <div className="card rounded-lg p-4 flex flex-wrap items-center gap-3">
        <label className="text-xs font-semibold text-slate-500">PROJECT</label>
        <select value={project.id} onChange={e=>setSelectedId(e.target.value)} className="text-sm px-3 py-1.5 rounded-md border bg-white flex-1 min-w-[220px]" style={{borderColor:"var(--border)"}}>
          {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        <button onClick={run} disabled={running} className="px-4 py-2 rounded-md text-white text-xs font-bold tracking-wide relative overflow-hidden" style={{background:"var(--accent)"}}>
          {running? "RUNNING AI ANALYSIS…" : "▶ RUN AI ANALYSIS"}
          {running && <span className="absolute left-0 top-0 h-full w-1/4 bg-white/25 scan-anim"/>}
        </button>
      </div>

      {running && (
        <div className="card rounded-lg p-8 text-center text-sm text-slate-500 font-mono">
          Project Data → AI Analysis → Delay Prediction → Cost Overrun Prediction → Risk Score → Explanation → Early Warning
        </div>
      )}

      {!running && result && (
        <React.Fragment>
          <div className="card rounded-lg p-6">
            <div className="flex items-center justify-between mb-4">
              <div>
                <div className="text-xs text-slate-400">OVERALL RISK</div>
                <div className="font-display font-bold text-2xl" style={{color:RISK_COLORS[result.classification]}}>{result.classification} — {result.overallRisk}%</div>
              </div>
              <div className="text-right">
                <div className="text-xs text-slate-400">ESTIMATED DELAY</div>
                <div className="font-mono font-bold text-lg">{result.estDelayMonths} months</div>
                <div className="text-xs text-slate-400 mt-1">ESTIMATED COST OVERRUN</div>
                <div className="font-mono font-bold text-lg">{fmtCr(result.estCostOverrunCr)}</div>
              </div>
            </div>
            <div className="grid grid-cols-3 gap-4 justify-items-center border-t pt-5" style={{borderColor:"var(--border)"}}>
              <Gauge value={result.overallRisk} color={RISK_COLORS[result.classification]} label="Overall Risk" size={140}/>
              <Gauge value={result.delayRisk} color="var(--o)" label="Delay Risk" size={140}/>
              <Gauge value={result.costRisk} color="var(--r)" label="Cost Overrun Risk" size={140}/>
            </div>
          </div>

          <div className="card rounded-lg p-6">
            <div className="text-sm font-semibold mb-3" style={{color:"var(--navy)"}}>Why is this project at risk?</div>
            <ul className="space-y-1.5 mb-5">
              {result.reasons.map((r,i)=><li key={i} className="text-sm text-slate-600 flex gap-2"><span style={{color:"var(--accent)"}}>—</span>{r}</li>)}
            </ul>
            <div className="text-xs font-semibold text-slate-500 mb-2">FEATURE IMPORTANCE (SHAP-style contribution)</div>
            <HBarChart data={result.factors} colorFn={d=>d.value>60?"var(--r)":d.value>35?"var(--o)":"var(--accent)"}/>
          </div>

          <div className="card rounded-lg p-6">
            <div className="text-sm font-semibold mb-3" style={{color:"var(--navy)"}}>Recommended Actions</div>
            <div className="grid sm:grid-cols-2 gap-2">
              {result.actions.map((a,i)=>(
                <div key={i} className="text-sm px-3 py-2 rounded-md" style={{background:"#F3F7FF",color:"var(--navy2)"}}>✓ {a}</div>
              ))}
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Early Warnings ---------------- */
function EarlyWarningsPage({projects,alerts,setAlerts}){
  const update = (id,patch)=> setAlerts(alerts.map(a=>a.id===id?{...a,...patch}:a));
  const [commentDraft,setCommentDraft]=useState({});

  return (
    <div className="p-6 space-y-4 fadein">
      {alerts.length===0 && <div className="card rounded-lg p-8 text-center text-slate-400 text-sm">No active early warnings.</div>}
      {alerts.map(a=>{
        const p = projects.find(pr=>pr.id===a.projectId);
        if(!p) return null;
        const ai = runAIAnalysis(p);
        return (
          <div key={a.id} className="card rounded-lg overflow-hidden">
            <div className="risk-strip h-1 w-full" style={{background:RISK_COLORS[ai.classification]}}/>
            <div className="p-5">
              <div className="flex items-start justify-between flex-wrap gap-2">
                <div>
                  <div className="text-xs font-bold tracking-wide" style={{color:RISK_COLORS[ai.classification]}}>
                    🚨 {ai.classification} WARNING
                  </div>
                  <div className="font-display font-semibold text-base mt-1">{p.name}</div>
                  <div className="text-xs text-slate-400">{p.location} · Risk Score {ai.overallRisk}%</div>
                </div>
                <div className="flex items-center gap-2">
                  <select value={a.priority} onChange={e=>update(a.id,{priority:e.target.value})} className="text-xs px-2 py-1 rounded-md border bg-white" style={{borderColor:"var(--border)"}}>
                    <option>Low</option><option>Medium</option><option>High</option><option>Urgent</option>
                  </select>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500">
                    <input type="checkbox" checked={a.reviewed} onChange={e=>update(a.id,{reviewed:e.target.checked})}/> Reviewed
                  </label>
                </div>
              </div>
              <div className="text-sm text-slate-600 mt-3">{ai.reasons[0]}</div>
              <div className="text-xs font-semibold text-slate-500 mt-3 mb-1">RECOMMENDED ACTIONS</div>
              <ul className="text-sm text-slate-600 space-y-1">
                {ai.actions.map((r,i)=><li key={i}>• {r}</li>)}
              </ul>
              <div className="flex flex-wrap items-center gap-2 mt-4 pt-3 border-t" style={{borderColor:"var(--border)"}}>
                <input placeholder="Assign to officer…" value={a.assignee} onChange={e=>update(a.id,{assignee:e.target.value})}
                  className="text-xs px-2.5 py-1.5 rounded-md border" style={{borderColor:"var(--border)"}}/>
                <input placeholder="Add a comment…" value={commentDraft[a.id]||""} onChange={e=>setCommentDraft({...commentDraft,[a.id]:e.target.value})}
                  className="text-xs px-2.5 py-1.5 rounded-md border flex-1 min-w-[160px]" style={{borderColor:"var(--border)"}}/>
                <button onClick={()=>{ if((commentDraft[a.id]||"").trim()){ update(a.id,{comments:[...a.comments,commentDraft[a.id]]}); setCommentDraft({...commentDraft,[a.id]:""}); } }}
                  className="text-xs font-semibold px-3 py-1.5 rounded-md text-white" style={{background:"var(--navy)"}}>Add</button>
              </div>
              {a.comments.length>0 && (
                <div className="mt-2 space-y-1">
                  {a.comments.map((c,i)=><div key={i} className="text-xs text-slate-500 bg-slate-50 rounded-md px-2.5 py-1.5">💬 {c}</div>)}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Project Details ---------------- */
function ProjectDetailsPage({project,alerts}){
  if(!project) return <div className="p-6 text-slate-400 text-sm">Project not found.</div>;
  const ai = runAIAnalysis(project);
  const relatedAlert = alerts.find(a=>a.projectId===project.id);
  const milestoneArr = Array.from({length:project.totalMilestones},(_,i)=>i<project.completedMilestones?"done":(i<project.completedMilestones+project.delayedMilestones?"delayed":"pending"));

  return (
    <div className="p-6 space-y-5 fadein">
      <div className="card rounded-lg p-6">
        <div className="flex justify-between items-start flex-wrap gap-2">
          <div>
            <div className="font-display font-bold text-xl" style={{color:"var(--navy)"}}>{project.name}</div>
            <div className="text-sm text-slate-500">{project.location} · {project.type} · {project.state}</div>
          </div>
          <div className="text-right">
            <div className="text-xs text-slate-400">RISK SCORE</div>
            <div className="font-display font-bold text-2xl" style={{color:RISK_COLORS[ai.classification]}}>{ai.overallRisk}% · {ai.classification}</div>
          </div>
        </div>
        <div className="grid sm:grid-cols-4 gap-4 mt-5 pt-5 border-t" style={{borderColor:"var(--border)"}}>
          <div><div className="text-xs text-slate-400">Planned Cost</div><div className="font-mono font-semibold">{fmtCr(project.plannedCost)}</div></div>
          <div><div className="text-xs text-slate-400">Expenditure</div><div className="font-mono font-semibold">{fmtCr(project.currentExpenditure)}</div></div>
          <div><div className="text-xs text-slate-400">Timeline</div><div className="font-mono font-semibold">{project.plannedDuration}mo → {project.actualDuration}mo</div></div>
          <div><div className="text-xs text-slate-400">Progress</div><div className="font-mono font-semibold">{project.actualProgress}% / {project.plannedProgress}%</div></div>
        </div>
      </div>

      <div className="card rounded-lg p-6">
        <div className="text-sm font-semibold mb-4" style={{color:"var(--navy)"}}>Milestone Timeline — Planned vs Actual</div>
        <div className="text-[11px] text-slate-400 mb-1.5">Planned</div>
        <div className="flex gap-1.5 mb-3">{Array.from({length:project.totalMilestones}).map((_,i)=><div key={i} className="h-2.5 flex-1 rounded-sm" style={{background:"#B9CBE8"}}/>)}</div>
        <div className="text-[11px] text-slate-400 mb-1.5">Actual</div>
        <div className="flex gap-1.5">
          {milestoneArr.map((s,i)=>(
            <div key={i} className="h-2.5 flex-1 rounded-sm" style={{background: s==="done"?RISK_COLORS.LOW : s==="delayed"?RISK_COLORS.CRITICAL : "#E7ECF3"}}/>
          ))}
        </div>
        <div className="flex gap-4 text-[11px] text-slate-500 mt-2">
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{background:RISK_COLORS.LOW}}/>Completed</span>
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{background:RISK_COLORS.CRITICAL}}/>Delayed</span>
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{background:"#E7ECF3"}}/>Pending</span>
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        <div className="card rounded-lg p-6">
          <div className="text-sm font-semibold mb-3" style={{color:"var(--navy)"}}>AI Prediction</div>
          <div className="grid grid-cols-3 gap-2 justify-items-center">
            <Gauge value={ai.overallRisk} color={RISK_COLORS[ai.classification]} label="Overall" size={100}/>
            <Gauge value={ai.delayRisk} color="var(--o)" label="Delay" size={100}/>
            <Gauge value={ai.costRisk} color="var(--r)" label="Cost" size={100}/>
          </div>
        </div>
        <div className="card rounded-lg p-6">
          <div className="text-sm font-semibold mb-3" style={{color:"var(--navy)"}}>Risk Factors</div>
          <HBarChart data={ai.factors.slice(0,4)} colorFn={d=>d.value>60?"var(--r)":d.value>35?"var(--o)":"var(--accent)"}/>
        </div>
      </div>

      <div className="card rounded-lg p-6">
        <div className="text-sm font-semibold mb-2" style={{color:"var(--navy)"}}>Alerts</div>
        {relatedAlert ? (
          <div className="text-sm text-slate-600">🚨 {ai.classification} warning active · Priority: {relatedAlert.priority} · {relatedAlert.reviewed?"Reviewed":"Pending review"}</div>
        ) : <div className="text-sm text-slate-400">No active alerts for this project.</div>}
        <div className="text-xs font-semibold text-slate-500 mt-4 mb-1">RECOMMENDED ACTIONS</div>
        <ul className="text-sm text-slate-600 space-y-1">{ai.actions.map((a,i)=><li key={i}>• {a}</li>)}</ul>
      </div>
    </div>
  );
}

/* ---------------- Reports ---------------- */
function ReportsPage({projects}){
  const [selected,setSelected]=useState(projects[0]?.id);
  const project = projects.find(p=>p.id===selected);
  const ai = project && runAIAnalysis(project);

  const download=()=>{
    if(!project) return;
    const lines = [
      `INFRASHIELD AI — PROJECT REPORT`,
      `Generated: ${new Date().toLocaleString()}`,
      ``,
      `Project: ${project.name}`,
      `Type: ${project.type} | Location: ${project.location}, ${project.state}`,
      ``,
      `PROGRESS ANALYSIS`,
      `Planned Progress: ${project.plannedProgress}% | Actual Progress: ${project.actualProgress}%`,
      ``,
      `COST ANALYSIS`,
      `Planned Cost: ₹${project.plannedCost} Cr | Expenditure: ₹${project.currentExpenditure} Cr`,
      ``,
      `DELAY ANALYSIS`,
      `Planned Duration: ${project.plannedDuration} months | Actual: ${project.actualDuration} months`,
      ``,
      `RISK PREDICTION`,
      `Overall Risk: ${ai.classification} (${ai.overallRisk}%) | Delay Risk: ${ai.delayRisk}% | Cost Overrun Risk: ${ai.costRisk}%`,
      `Estimated Delay: ${ai.estDelayMonths} months | Estimated Cost Overrun: ₹${ai.estCostOverrunCr} Cr`,
      ``,
      `AI EXPLANATION`,
      ...ai.reasons.map(r=>"- "+r),
      ``,
      `RECOMMENDATIONS`,
      ...ai.actions.map(r=>"- "+r),
    ];
    const blob = new Blob([lines.join("\n")],{type:"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`${project.id}_Report.txt`; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="p-6 fadein max-w-3xl">
      <div className="card rounded-lg p-6">
        <div className="text-sm font-semibold mb-3" style={{color:"var(--navy)"}}>Generate Project Report</div>
        <select value={selected} onChange={e=>setSelected(e.target.value)} className="w-full text-sm px-3 py-2 rounded-md border bg-white mb-4" style={{borderColor:"var(--border)"}}>
          {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        {project && ai && (
          <div className="text-sm text-slate-600 space-y-2 border-t pt-4" style={{borderColor:"var(--border)"}}>
            <div><b>Summary:</b> {project.name} is {ai.overallRisk}% risk ({ai.classification}), currently {project.actualProgress}% complete against a planned {project.plannedProgress}%.</div>
            <div><b>Cost:</b> ₹{project.currentExpenditure} Cr spent of ₹{project.plannedCost} Cr planned. Projected overrun: {fmtCr(ai.estCostOverrunCr)}.</div>
            <div><b>Delay:</b> Estimated additional delay of {ai.estDelayMonths} months.</div>
          </div>
        )}
        <button onClick={download} className="mt-5 w-full py-2.5 rounded-md text-white text-sm font-semibold" style={{background:"var(--navy)"}}>⬇ Download Report</button>
      </div>
    </div>
  );
}

/* ---------------- Settings ---------------- */
function SettingsPage(){
  return (
    <div className="p-6 fadein max-w-2xl">
      <div className="card rounded-lg p-6 space-y-4">
        <div className="text-sm font-semibold" style={{color:"var(--navy)"}}>Prediction Engine</div>
        <div className="flex items-center justify-between text-sm">
          <span className="text-slate-600">Model backend</span>
          <span className="font-mono text-xs px-2 py-1 rounded-md" style={{background:"#F3F7FF",color:"var(--navy2)"}}>demo-engine v1 (rule-based)</span>
        </div>
        <div className="flex items-center justify-between text-sm">
          <span className="text-slate-600">Ready for XGBoost / Scikit-learn model</span>
          <span className="text-xs font-semibold" style={{color:"var(--g)"}}>✓ Architecture ready</span>
        </div>
        <div className="flex items-center justify-between text-sm">
          <span className="text-slate-600">Explainability</span>
          <span className="font-mono text-xs px-2 py-1 rounded-md" style={{background:"#F3F7FF",color:"var(--navy2)"}}>SHAP-compatible output</span>
        </div>
        <div className="text-sm font-semibold pt-3 border-t" style={{color:"var(--navy)",borderColor:"var(--border)"}}>Notification Thresholds</div>
        <label className="flex items-center justify-between text-sm text-slate-600">Alert on HIGH risk <input type="checkbox" defaultChecked/></label>
        <label className="flex items-center justify-between text-sm text-slate-600">Alert on CRITICAL risk <input type="checkbox" defaultChecked/></label>
        <label className="flex items-center justify-between text-sm text-slate-600">Weekly summary email <input type="checkbox"/></label>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [loggedIn,setLoggedIn]=useState(false);
  const [page,setPage]=useState("dashboard");
  const [collapsed,setCollapsed]=useState(false);
  const [projects,setProjects]=useState(SAMPLE_PROJECTS);
  const [selectedProjectId,setSelectedProjectId]=useState(SAMPLE_PROJECTS[0].id);
  const [detailsId,setDetailsId]=useState(null);
  const [alerts,setAlerts]=useState(()=>
    SAMPLE_PROJECTS.filter(p=>runAIAnalysis(p).classification==="HIGH"||runAIAnalysis(p).classification==="CRITICAL")
      .map(p=>({id:"A-"+p.id,projectId:p.id,reviewed:false,assignee:"",priority: runAIAnalysis(p).classification==="CRITICAL"?"Urgent":"High",comments:[]}))
  );

  if(!loggedIn) return <LoginPage onLogin={()=>setLoggedIn(true)}/>;

  const goDetails = id => { setDetailsId(id); setPage("details"); };
  const onAnalyze = project => {
    setProjects([project,...projects]);
    setAlerts(prev=>{
      const ai = runAIAnalysis(project);
      if(ai.classification==="HIGH"||ai.classification==="CRITICAL"){
        return [{id:"A-"+project.id,projectId:project.id,reviewed:false,assignee:"",priority:ai.classification==="CRITICAL"?"Urgent":"High",comments:[]},...prev];
      }
      return prev;
    });
    setSelectedProjectId(project.id);
    setPage("ai");
  };

  const titles = {dashboard:"Dashboard",projects:"Projects",add:"Add Project",ai:"AI Risk Analysis",warnings:"Early Warning System",reports:"Reports",settings:"Settings",details:"Project Details"};

  return (
    <div className="flex" style={{background:"var(--bg)"}}>
      <Sidebar page={page} setPage={setPage} collapsed={collapsed} setCollapsed={setCollapsed}/>
      <div className="flex-1 min-w-0">
        <TopBar title={titles[page]} onLogout={()=>setLoggedIn(false)}/>
        {page==="dashboard" && <DashboardPage projects={projects} goDetails={goDetails}/>}
        {page==="projects" && <ProjectsPage projects={projects} goDetails={goDetails}/>}
        {page==="add" && <AddProjectPage onAnalyze={onAnalyze}/>}
        {page==="ai" && <AIAnalysisPage projects={projects} selectedId={selectedProjectId} setSelectedId={setSelectedProjectId}/>}
        {page==="warnings" && <EarlyWarningsPage projects={projects} alerts={alerts} setAlerts={setAlerts}/>}
        {page==="reports" && <ReportsPage projects={projects}/>}
        {page==="settings" && <SettingsPage/>}
        {page==="details" && <ProjectDetailsPage project={projects.find(p=>p.id===detailsId)} alerts={alerts}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
